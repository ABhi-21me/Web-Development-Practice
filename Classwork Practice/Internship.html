<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Internship Application Form</h1>

    <form action="/register" method="post">

        <h3>Personal Information</h3>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <br>
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <br>
        <br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

        <br>
        <br>

        <label for="dateofbirth">Date of Birth:</label>
        <input type="date" id="dateofbirth" name="dateofbirth" required>

        <br>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <br>
        <br>

        <label for="gender">Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br>
        <br>

        <label for="course">Select Course:</label>
        <select id="" name="course" required>
            <option value="">Select a course</option>
            <option value="cse">CSE</option>
            <option value="it">IT</option>
            <option value="ece">ECE</option>
            <option value="mechanical">Mechanical</option>
        </select>

        <br>
        <br>

        <label for="skills">Skills:</label>

        <input type="checkbox" id="" name="skills" value="python">
        <label for="python">Python</label>

        <input type="checkbox" id="" name="skills" value="java">
        <label for="java">Java</label>
        
        <br>
        <br>

        <label for="upload">Upload Resume:</label>
        <input type="file" id="upload" name="upload" accept=".pdf,.doc,.docx" required>

        <br>
        <br>

        <label for="message">Message:</label>
        <textarea name="message" id="message" placeholder="Write your message here..."></textarea>

        <br>
        <br>
        
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</body>
</html>
